[workspace]
resolver = "3"
members = [
    "crates/sandbolt-unicode",
    "crates/sandbolt-dtoa",
    "crates/sandbolt-bigint",
    "crates/sandbolt-regexp",
    "crates/sandbolt-syntax",
    "crates/sandbolt-bytecode",
    "crates/sandbolt-compiler",
    "crates/sandbolt-runtime",
    "crates/sandbolt-test262",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
sandbolt-unicode = { path = "crates/sandbolt-unicode" }
sandbolt-dtoa = { path = "crates/sandbolt-dtoa" }
sandbolt-bigint = { path = "crates/sandbolt-bigint" }
sandbolt-regexp = { path = "crates/sandbolt-regexp" }
sandbolt-syntax = { path = "crates/sandbolt-syntax" }
sandbolt-bytecode = { path = "crates/sandbolt-bytecode" }
sandbolt-compiler = { path = "crates/sandbolt-compiler" }
sandbolt-runtime = { path = "crates/sandbolt-runtime" }
